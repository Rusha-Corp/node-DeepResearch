apiVersion: rusha.io/v1
kind: System
metadata:
  name: "{{ .SystemAlias }}"
  project: "{{ .ProjectAlias }}"
  org: "{{ .OrgAlias }}"
spec:
  pipelineMode: rusha_managed
  services:
    - name: app
      type: server
      port: 3000
      internetFacing: true
      vcs:
        dockerfile: Dockerfile
      resources:
        cpu: "500m"
        memory: "512Mi"
      env:
        - name: LLM_PROVIDER
          secretKey: LLM_PROVIDER
        - name: GCLOUD_PROJECT
          secretKey: GCLOUD_PROJECT
